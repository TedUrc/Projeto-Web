services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: logistica_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: logistica_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./back-end
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./back-end/.env

volumes:
  postgres_data: